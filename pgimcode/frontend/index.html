<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body class="bg-gray-50 min-h-screen flex items-start justify-center p-6">
    <div class="w-full max-w-2xl bg-white rounded-2xl shadow-lg p-8 mt-10">
        <h1 class="text-3xl font-bold text-gray-800 mb-6"><i class="fas fa-wallet text-blue-500 mr-2"></i>Expense Tracker</h1>

        <!-- Balance Display -->
        <div class="bg-gradient-to-r from-blue-500 to-indigo-600 text-white rounded-xl p-6 mb-6">
            <p class="text-sm opacity-80"><i class="fas fa-coins mr-1"></i>Your Balance</p>
            <p id="balance" class="text-4xl font-bold mt-1">$0.00</p>
        </div>

        <!-- Income / Expense Summary -->
        <div class="flex gap-4 mb-6">
            <div class="flex-1 bg-green-50 border border-green-200 rounded-xl p-4 text-center">
                <i class="fas fa-arrow-down text-green-500 text-xl mb-1"></i>
                <p class="text-sm text-green-600 font-medium">Income</p>
                <p id="income" class="text-xl font-bold text-green-700">$0.00</p>
            </div>
            <div class="flex-1 bg-red-50 border border-red-200 rounded-xl p-4 text-center">
                <i class="fas fa-arrow-up text-red-500 text-xl mb-1"></i>
                <p class="text-sm text-red-600 font-medium">Expenses</p>
                <p id="expense" class="text-xl font-bold text-red-700">$0.00</p>
            </div>
        </div>

        <!-- Add Transaction Form -->
        <form id="form" class="mb-6">
            <h2 class="text-lg font-semibold text-gray-700 mb-3"><i class="fas fa-plus-circle text-blue-500 mr-1"></i> Add New Transaction</h2>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <input
                    type="text"
                    id="description"
                    placeholder="Description"
                    required
                    class="border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
                />
                <input
                    type="number"
                    id="amount"
                    placeholder="Amount"
                    step="0.01"
                    required
                    class="border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400"
                />
                <button
                    type="submit"
                    class="bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg px-4 py-2 transition"
                >
                    Add <i class="fas fa-plus ml-1"></i>
                </button>
            </div>
            <label class="flex items-center gap-2 mt-2 text-sm text-gray-600">
                <input type="checkbox" id="isExpense" checked />
                Mark as expense (negative)
            </label>
        </form>

        <!-- Transaction History -->
        <h2 class="text-lg font-semibold text-gray-700 mb-3"><i class="fas fa-list text-gray-500 mr-1"></i> History</h2>
        <ul id="list" class="space-y-2 max-h-80 overflow-y-auto pr-1">
            <!-- Transactions will be rendered here -->
        </ul>

        <!-- Clear All -->
        <button
            id="clearBtn"
            class="mt-4 w-full text-sm text-red-500 hover:text-red-700 underline transition"
        >
            <i class="fas fa-trash-alt mr-1"></i> Clear All Transactions
        </button>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="fixed inset-0 bg-black/40 flex items-center justify-center hidden z-50">
        <div class="bg-white rounded-2xl shadow-xl p-6 w-full max-w-sm mx-4">
            <h2 class="text-lg font-semibold text-gray-800 mb-4"><i class="fas fa-edit text-blue-500 mr-1"></i> Edit Transaction</h2>
            <form id="editForm">
                <input
                    type="text"
                    id="editDescription"
                    placeholder="Description"
                    required
                    class="w-full border border-gray-300 rounded-lg px-4 py-2 mb-3 focus:outline-none focus:ring-2 focus:ring-blue-400"
                />
                <input
                    type="number"
                    id="editAmount"
                    placeholder="Amount"
                    step="0.01"
                    required
                    class="w-full border border-gray-300 rounded-lg px-4 py-2 mb-3 focus:outline-none focus:ring-2 focus:ring-blue-400"
                />
                <label class="flex items-center gap-2 mb-4 text-sm text-gray-600">
                    <input type="checkbox" id="editIsExpense" checked />
                    Mark as expense (negative)
                </label>
                <div class="flex gap-2">
                    <button
                        type="submit"
                        class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg px-4 py-2 transition"
                    >
                        <i class="fas fa-save mr-1"></i> Save
                    </button>
                    <button
                        type="button"
                        id="editCancelBtn"
                        class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-700 font-medium rounded-lg px-4 py-2 transition"
                    >
                        <i class="fas fa-times mr-1"></i> Cancel
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // --- State ---
        let transactions = JSON.parse(localStorage.getItem("transactions")) || [];

        // --- DOM refs ---
        const balanceEl = document.getElementById("balance");
        const incomeEl = document.getElementById("income");
        const expenseEl = document.getElementById("expense");
        const listEl = document.getElementById("list");
        const form = document.getElementById("form");
        const descInput = document.getElementById("description");
        const amountInput = document.getElementById("amount");
        const isExpenseCheck = document.getElementById("isExpense");
        const clearBtn = document.getElementById("clearBtn");
        const editModal = document.getElementById("editModal");
        const editForm = document.getElementById("editForm");
        const editDescription = document.getElementById("editDescription");
        const editAmount = document.getElementById("editAmount");
        const editIsExpense = document.getElementById("editIsExpense");
        const editCancelBtn = document.getElementById("editCancelBtn");
        let editIndex = null; // index of transaction being edited

        // --- Helpers ---
        function save() {
            localStorage.setItem("transactions", JSON.stringify(transactions));
        }

        function formatCurrency(n) {
            return "$" + Math.abs(n).toFixed(2);
        }

        // --- Update UI ---
        function updateSummary() {
            const amounts = transactions.map((t) => t.amount);
            const total = amounts.reduce((sum, n) => sum + n, 0);
            const income = amounts.filter((n) => n > 0).reduce((sum, n) => sum + n, 0);
            const expense = amounts.filter((n) => n < 0).reduce((sum, n) => sum + n, 0);

            balanceEl.textContent = (total < 0 ? "-" : "") + formatCurrency(total);
            incomeEl.textContent = formatCurrency(income);
            expenseEl.textContent = formatCurrency(expense);
        }

        function renderList() {
            listEl.innerHTML = "";
            transactions.forEach((t, i) => {
                const li = document.createElement("li");
                const isNegative = t.amount < 0;
                li.className =
                    "flex justify-between items-center bg-gray-50 border border-gray-200 rounded-lg px-4 py-3";

                li.innerHTML = `
                    <span class="text-gray-800 font-medium">${t.description}</span>
                    <div class="flex items-center gap-3">
                        <span class="${isNegative ? "text-red-600" : "text-green-600"} font-semibold">
                            ${isNegative ? "-" : "+"}${formatCurrency(t.amount)}
                        </span>
                        <button
                            data-index="${i}"
                            class="edit-btn text-gray-400 hover:text-blue-500 transition text-lg leading-none mr-2"
                            title="Edit"
                        ><i class="fas fa-pen"></i></button>
                        <button
                            data-index="${i}"
                            class="delete-btn text-gray-400 hover:text-red-500 transition text-lg leading-none"
                        ><i class="fas fa-trash"></i></button>
                    </div>
                `;
                listEl.appendChild(li);
            });

            // Attach delete handlers
            document.querySelectorAll(".delete-btn").forEach((btn) => {
                btn.addEventListener("click", () => {
                    const idx = parseInt(btn.dataset.index);
                    transactions.splice(idx, 1);
                    save();
                    refresh();
                });
            });

            // Attach edit handlers
            document.querySelectorAll(".edit-btn").forEach((btn) => {
                btn.addEventListener("click", () => {
                    const idx = parseInt(btn.dataset.index);
                    const t = transactions[idx];
                    editIndex = idx;
                    editDescription.value = t.description;
                    editAmount.value = Math.abs(t.amount);
                    editIsExpense.checked = t.amount < 0;
                    editModal.classList.remove("hidden");
                });
            });
        }

        function refresh() {
            updateSummary();
            renderList();
        }

        // --- Events ---
        form.addEventListener("submit", (e) => {
            e.preventDefault();
            const desc = descInput.value.trim();
            const raw = parseFloat(amountInput.value);
            if (!desc || isNaN(raw) || raw <= 0) return;

            const amount = isExpenseCheck.checked ? -raw : raw;
            transactions.push({ description: desc, amount });
            save();
            refresh();
            form.reset();
            isExpenseCheck.checked = true;
        });

        // --- Edit Modal Events ---
        editForm.addEventListener("submit", (e) => {
            e.preventDefault();
            const desc = editDescription.value.trim();
            const raw = parseFloat(editAmount.value);
            if (!desc || isNaN(raw) || raw <= 0 || editIndex === null) return;

            const amount = editIsExpense.checked ? -raw : raw;
            transactions[editIndex] = { description: desc, amount };
            editIndex = null;
            save();
            refresh();
            editModal.classList.add("hidden");
        });

        editCancelBtn.addEventListener("click", () => {
            editIndex = null;
            editModal.classList.add("hidden");
        });

        // Close modal on backdrop click
        editModal.addEventListener("click", (e) => {
            if (e.target === editModal) {
                editIndex = null;
                editModal.classList.add("hidden");
            }
        });

        clearBtn.addEventListener("click", () => {
            if (transactions.length === 0) return;
            if (confirm("Delete all transactions?")) {
                transactions = [];
                save();
                refresh();
            }
        });

        // --- Init ---
        refresh();
    </script>
</body>
</html>
