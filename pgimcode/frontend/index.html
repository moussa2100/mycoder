<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">

    <!-- Stunning Modern Header -->
    <header class="relative bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-500 text-white shadow-2xl">
        <!-- Decorative background blobs -->
        <div class="absolute inset-0 overflow-hidden pointer-events-none">
            <div class="absolute -top-20 -right-20 w-72 h-72 bg-white/10 rounded-full blur-3xl"></div>
            <div class="absolute -bottom-16 -left-16 w-56 h-56 bg-pink-300/20 rounded-full blur-3xl"></div>
            <div class="absolute top-10 left-1/3 w-32 h-32 bg-indigo-300/20 rounded-full blur-2xl"></div>
        </div>

        <!-- Navigation Bar -->
        <nav class="relative z-10 flex items-center justify-between px-6 py-4 md:px-12 lg:px-20 border-b border-white/10">
            <!-- Logo -->
            <a href="#" class="flex items-center gap-2 group">
                <div class="w-10 h-10 bg-white/20 backdrop-blur-sm rounded-xl flex items-center justify-center transition-transform duration-300 group-hover:scale-110 group-hover:rotate-6">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                    </svg>
                </div>
                <span class="text-xl font-bold tracking-tight">Brand</span>
            </a>

            <!-- Desktop Nav Links -->
            <div class="hidden md:flex items-center gap-8">
                <a href="#" class="relative text-white/80 hover:text-white transition-colors duration-200 after:absolute after:-bottom-1 after:left-0 after:w-0 after:h-0.5 after:bg-white after:rounded-full after:transition-all after:duration-300 hover:after:w-full">Home</a>
                <a href="#" class="relative text-white/80 hover:text-white transition-colors duration-200 after:absolute after:-bottom-1 after:left-0 after:w-0 after:h-0.5 after:bg-white after:rounded-full after:transition-all after:duration-300 hover:after:w-full">Features</a>
                <a href="#" class="relative text-white/80 hover:text-white transition-colors duration-200 after:absolute after:-bottom-1 after:left-0 after:w-0 after:h-0.5 after:bg-white after:rounded-full after:transition-all after:duration-300 hover:after:w-full">Pricing</a>
                <a href="#" class="relative text-white/80 hover:text-white transition-colors duration-200 after:absolute after:-bottom-1 after:left-0 after:w-0 after:h-0.5 after:bg-white after:rounded-full after:transition-all after:duration-300 hover:after:w-full">About</a>
            </div>

            <!-- CTA & Mobile Toggle -->
            <div class="flex items-center gap-4">
                <a href="#" class="hidden sm:inline-flex items-center px-5 py-2 bg-white text-indigo-600 font-semibold rounded-full shadow-lg hover:shadow-xl hover:bg-gray-50 transition-all duration-300 transform hover:-translate-y-0.5">
                    Get Started
                </a>
                <!-- Mobile hamburger -->
                <button id="menu-toggle" class="md:hidden flex flex-col gap-1.5 p-2 rounded-lg hover:bg-white/10 transition-colors duration-200">
                    <span class="block w-6 h-0.5 bg-white rounded-full transition-all duration-300"></span>
                    <span class="block w-6 h-0.5 bg-white rounded-full transition-all duration-300"></span>
                    <span class="block w-4 h-0.5 bg-white rounded-full transition-all duration-300"></span>
                </button>
            </div>
        </nav>

        <!-- Hero Section inside header -->
        <div class="relative z-10 px-6 py-16 md:py-24 md:px-12 lg:px-20 text-center">
            <h1 class="text-4xl md:text-6xl lg:text-7xl font-extrabold tracking-tight leading-tight">
                Build <span class="text-transparent bg-clip-text bg-gradient-to-r from-yellow-200 to-orange-300">Something</span>
                <br class="hidden sm:block">Amazing
            </h1>
            <p class="mt-6 max-w-2xl mx-auto text-lg md:text-xl text-white/80 leading-relaxed">
                Craft stunning digital experiences with modern tools and a beautiful design system that scales.
            </p>
            <div class="mt-10 flex flex-col sm:flex-row items-center justify-center gap-4">
                <a href="#" class="px-8 py-3.5 bg-white text-indigo-600 font-bold rounded-full shadow-xl hover:shadow-2xl hover:bg-gray-50 transition-all duration-300 transform hover:-translate-y-1 hover:scale-105">
                    Start Free Trial
                </a>
                <a href="#" class="px-8 py-3.5 border-2 border-white/30 text-white font-semibold rounded-full hover:bg-white/10 hover:border-white/50 transition-all duration-300 transform hover:-translate-y-1">
                    Learn More
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex items-center justify-center min-h-[50vh]">
        <div class="bg-white p-8 rounded-lg shadow-md">
            <p class="text-xl text-gray-700">hello world</p>
            <p class="text-2xl text-blue-600 font-bold mt-4">Hello Mohamed Moussa</p>
        </div>
    </main>

    <!-- Mobile Menu Overlay -->
    <div id="mobile-menu" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" id="menu-backdrop"></div>
        <div class="relative z-10 flex flex-col items-center justify-center h-full gap-8 text-2xl font-semibold text-white">
            <a href="#" class="hover:text-indigo-300 transition-colors duration-200">Home</a>
            <a href="#" class="hover:text-indigo-300 transition-colors duration-200">Features</a>
            <a href="#" class="hover:text-indigo-300 transition-colors duration-200">Pricing</a>
            <a href="#" class="hover:text-indigo-300 transition-colors duration-200">About</a>
            <a href="#" class="mt-4 px-8 py-3 bg-white text-indigo-600 font-bold rounded-full shadow-xl hover:bg-gray-50 transition-all duration-300">
                Get Started
            </a>
        </div>
    </div>

    <script>
        // Mobile menu toggle
        const toggle = document.getElementById('menu-toggle');
        const menu = document.getElementById('mobile-menu');
        const backdrop = document.getElementById('menu-backdrop');

        toggle.addEventListener('click', () => {
            menu.classList.toggle('hidden');
            document.body.classList.toggle('overflow-hidden');
        });

        backdrop.addEventListener('click', () => {
            menu.classList.add('hidden');
            document.body.classList.remove('overflow-hidden');
        });
    </script>

</body>
</html>
