[tool.poetry]
name = "pgimcode-backend"
version = "1.0.0"
description = "pgimcode FastAPI Backend - API server for the Electron frontend"
authors = ["pgimcode"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = {version = "^0.32.0", extras = ["standard"]}
pydantic = "^2.0"
pydantic-settings = "^2.0"
httpx = "^0.28.0"
aiosqlite = "^0.20.0"
sse-starlette = "^2.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.24.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
pgimcode-server = "pgimcode_backend.main:main"
