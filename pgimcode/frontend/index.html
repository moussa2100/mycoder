<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pgimcode — Hello World</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900 flex items-center justify-center p-6">

    <div class="max-w-2xl w-full space-y-8">

        <!-- Card 1 -->
        <div class="bg-white/10 backdrop-blur-md rounded-2xl shadow-2xl border border-white/20 p-8 text-center transform transition-all duration-300 hover:scale-[1.02] hover:shadow-purple-500/25">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-gradient-to-r from-blue-500 to-cyan-400 mb-6 shadow-lg shadow-blue-500/30">
                <i class="fa-solid fa-globe text-white text-2xl"></i>
            </div>
            <h1 class="text-4xl font-extrabold text-white mb-2 tracking-tight">
                <i class="fa-solid fa-hand-wave text-yellow-400 mr-2 animate-bounce"></i>
                Hello World
            </h1>
            <p class="text-blue-200 text-lg font-medium">Welcome to pgimcode</p>
        </div>

        <!-- Card 2 -->
        <div class="bg-white/10 backdrop-blur-md rounded-2xl shadow-2xl border border-white/20 p-8 transform transition-all duration-300 hover:scale-[1.02] hover:shadow-green-500/25">
            <div class="flex items-center gap-4 mb-4">
                <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-gradient-to-r from-green-500 to-emerald-400 shadow-lg shadow-green-500/30">
                    <i class="fa-solid fa-code text-white text-xl"></i>
                </div>
                <div>
                    <p class="text-green-300 text-sm font-medium uppercase tracking-wider">
                        <i class="fa-regular fa-message mr-1"></i> Greeting
                    </p>
                    <p class="text-white text-2xl font-bold">Hi there</p>
                </div>
            </div>
            <div class="flex items-center gap-2 text-green-200/70 text-sm">
                <i class="fa-regular fa-circle-check text-green-400"></i>
                <span>Tailwind CSS &amp; Font Awesome integrated</span>
            </div>
        </div>

        <!-- Card 3 -->
        <div class="bg-white/10 backdrop-blur-md rounded-2xl shadow-2xl border border-white/20 p-8 transform transition-all duration-300 hover:scale-[1.02] hover:shadow-red-500/25">
            <div class="flex items-center gap-4 mb-4">
                <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-gradient-to-r from-red-500 to-rose-400 shadow-lg shadow-red-500/30">
                    <i class="fa-solid fa-user text-white text-xl"></i>
                </div>
                <div>
                    <p class="text-red-300 text-sm font-medium uppercase tracking-wider">
                        <i class="fa-regular fa-user mr-1"></i> Author
                    </p>
                    <p class="text-white text-2xl font-bold">Hello Mohamed Moussa</p>
                </div>
            </div>
            <div class="flex items-center gap-4 text-sm">
                <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-red-500/20 text-red-300 border border-red-500/30">
                    <i class="fa-brands fa-github"></i> pgimcode
                </span>
                <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-purple-500/20 text-purple-300 border border-purple-500/30">
                    <i class="fa-solid fa-terminal"></i> v1.0
                </span>
            </div>
        </div>

        <!-- Footer -->
        <div class="text-center text-white/40 text-sm">
            <i class="fa-regular fa-copyright mr-1"></i> 2025 pgimcode &mdash;
            built with
            <i class="fa-brands fa-tailwind text-sky-400 mx-0.5"></i>
            Tailwind CSS
            <i class="fa-solid fa-heart text-red-400 mx-1 animate-pulse"></i>
            <i class="fa-brands fa-font-awesome text-blue-400 mx-0.5"></i>
            Font Awesome
        </div>

    </div>

</body>
</html>
