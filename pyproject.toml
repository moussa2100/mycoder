[tool.poetry]
name = "pgimcode"
version = "0.1.0"
description = "Terminal coding agent with visible micro-steps"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [{ include = "pgimcode" }]

[tool.poetry.dependencies]
python = "^3.11"
typer = ">=0.15"
rich = "^13.0"
pydantic = "^2.0"
pydantic-settings = "^2.0"
python-ulid = { extras = ["pydantic"], version = "^2.0" }
platformdirs = "^4.0"
tree-sitter = ">=0.25"
tree-sitter-language-pack = ">=1.8"
deepagents = ">=0.6.8"
langchain-openai = "^1.2.2"
prompt-toolkit = "^3.0.52"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.23"
pytest-unordered = "^0.6"

[tool.poetry.scripts]
pgimcode = "pgimcode.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]